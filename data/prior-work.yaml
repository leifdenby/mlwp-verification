global_benchmark_datasets:
  - name: WeatherBench 2
    description: Global NWP reanalysis/forecast benchmark for ML weather models.
    link: https://weatherbench2.readthedocs.io/
  - name: ExtremeWeatherBench
    description: Open benchmark for evaluating ML weather models on extreme weather events.
    link: https://github.com/brightbandtech/ExtremeWeatherBench
  - name: ECMWF AI Weather Quest
    description: Medium-range benchmark tasks for data-driven weather prediction.
    link: https://www.ecmwf.int/en/forecasts/dataset/machine-learning-weather-prediction-datasets

global_forecast_verification_efforts:
  - name: WP-MIP Verification Wiki
    description: Community effort page for global forecast verification methods and coordination.
    link: https://github.com/WP-MIP/verification/wiki

verification_tooling:
  - name: METplus
    description: Community system for forecast verification and diagnostics across deterministic/probabilistic workflows.
    link: https://github.com/dtcenter/METplus
    language: Python, C++, Fortran
    input_format:
      - GRIB
      - NetCDF
      - BUFR
      - Point observations
    output_format: NetCDF, JSON, text/stat files, plots
  - name: scores
    description: Python package for weather and climate forecast verification metrics.
    link: https://github.com/nci/scores
    language: Python
    input_format:
      - xarray Dataset/DataArray
      - NumPy
      - pandas
    output_format: xarray, NumPy, pandas, Python objects
  - name: WeatherGenerator Evaluate
    description: ECMWF WeatherGenerator evaluation package for verification workflows.
    link: https://github.com/ecmwf/WeatherGenerator/tree/develop/packages/evaluate/
    language: Python
    input_format:
      - GRIB
      - Zarr
      - NetCDF
    output_format: NetCDF, parquet, plots
  - name: verif
    description: Forecast verification package from the Weather Forecasting and Radar Technologies group.
    link: https://github.com/WFRT/verif
    language: Python
    input_format:
      - name: Text format
        link: https://github.com/WFRT/verif/wiki/Arranging-my-own-data#text-based-input
      - name: NetCDF format
        link: https://github.com/WFRT/verif/wiki/Arranging-my-own-data#netcdf-based-input
    output_format: plots, text summaries
  - name: rmai-verification
    description: Verification tools and methods for regional ML weather prediction workflows.
    link: https://github.com/rmi-mlwp/rmai-verification
    language: Python
    input_format:
      - NetCDF
      - GRIB
      - CSV
    output_format: CSV, NetCDF, plots
  - name: harp
    description: Verification software for meteorological forecast and observation evaluation.
    link: https://github.com/harphub/harp
    language: R
    input_format:
      - name: NetCDF
        link: https://harphub.github.io/harpIO/reference/read_grid.html
      - name: GRIB
        link: https://harphub.github.io/harpIO/articles/file_options.html
      - name: FA
        link: https://harphub.github.io/harpIO/reference/read_forecast.html
      - name: vfld
        link: https://harphub.github.io/harpIO/articles/write_forecast_data.html
      - name: vobs / OBSTABLE
        link: https://harphub.github.io/harpIO/reference/read_point_obs.html
      - name: CSV observations (custom reader)
        link: https://harphub.github.io/harpIO/articles/read_csv_obs.html
    output_format: text tables, plots, verification scores
  - name: SpatialVx
    description: R package for spatial forecast verification methods and diagnostics.
    link: https://projects.ral.ucar.edu/icp/SpatialVx/
    language: R
    input_format:
      - gridded forecast fields
      - gridded observation fields
    output_format: verification scores, diagnostics, plots
  - name: swissai verification notebook
    description: Notebook example for ML weather verification workflow and diagnostics.
    link: https://nbviewer.org/github/sadamov/swissai/blob/main/verification.ipynb
    language: Python (Jupyter Notebook)
    input_format:
      - model forecast files
      - observation/reference data
    output_format: plots, summary verification metrics
